<style>
#family-trip-integrated{--ink:#152d40;--muted:#6c7c87;--bg:#f4f7f7;--line:#e4e9ea;--teal:#147b79;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#family-trip-integrated *{box-sizing:border-box}
#family-trip-integrated button,#family-trip-integrated input,#family-trip-integrated select{font:inherit}

#family-trip-integrated header{background:#10283b;color:white;padding:25px}
#family-trip-integrated h1{font-size:34px;line-height:1.1;margin:8px 0 12px;letter-spacing:-1px}

#family-trip-integrated .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:5px;background:#e8eeee;border-radius:15px}
#family-trip-integrated .tabs button{border:0;border-radius:11px;padding:12px 16px;background:transparent;font-weight:700}
#family-trip-integrated .tabs button.active{background:white;color:#152d40;box-shadow:0 2px 10px #10283b12}
#family-trip-integrated .regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
#family-trip-integrated .region{padding:0;border:0;text-align:right;background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #152d400d;min-width:0}
#family-trip-integrated .region-image{height:120px;display:flex;align-items:end;padding:16px;background:linear-gradient(130deg,#4d7b83,#10283b);color:white}
#family-trip-integrated .region-image strong{font-size:22px}
#family-trip-integrated .region-foot{padding:12px 15px;color:#6c7c87;font-size:13px}
#family-trip-integrated .back,#family-trip-integrated .smallbtn{border:0;background:white;border-radius:12px;padding:11px 16px;font-weight:700}
#family-trip-integrated .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
#family-trip-integrated input,#family-trip-integrated select{min-width:0;border:1px solid #e4e9ea;padding:12px;border-radius:12px;background:white;color:#152d40;max-width:100%}
#family-trip-integrated input{flex:1 1 210px}
#family-trip-integrated .categories{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
#family-trip-integrated .categories button{border:1px solid #d2e6de;background:white;color:#17665f;border-radius:20px;padding:9px 13px}
#family-trip-integrated .categories button.active{background:#147b79;color:white}
#family-trip-integrated .places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#family-trip-integrated .place{border:1px solid #e4e9ea;background:white;border-radius:16px;overflow:hidden;display:flex;text-align:right;min-height:145px;width:100%;padding:0}
#family-trip-integrated .thumb{flex:0 0 26%;background:linear-gradient(145deg,#96b6b3,#325968);display:grid;place-items:center;color:white;font-size:30px}
#family-trip-integrated .place-info{padding:15px;min-width:0}
#family-trip-integrated .place-info strong{font-size:17px;display:block;line-height:1.3}
#family-trip-integrated .place-info small{color:#6c7c87;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px}
#family-trip-integrated .pill{font-size:12px;color:#147b79;font-weight:700;margin-bottom:6px}
#family-trip-integrated .hint{font-size:13px;color:#6c7c87}
#family-trip-integrated .category-heading{border-top:1px solid #e4e9ea;margin:25px 0 12px;padding-top:15px;font-size:21px}
#family-trip-integrated .hero{height:140px;background:linear-gradient(130deg,#91b8b2,#1a5263);border-radius:20px;display:grid;place-items:center;font-size:45px;color:white;margin:15px 0}

#family-trip-integrated .more p{white-space:pre-line;color:#425665}
#family-trip-integrated .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#family-trip-integrated a{color:#147b79}
#family-trip-integrated .maplink{display:inline-block;background:#147b79;color:white;text-decoration:none;padding:12px 18px;border-radius:12px;margin:5px}
#family-trip-integrated .stay{display:flex;gap:16px;background:white;border:1px solid #e4e9ea;border-radius:18px;padding:18px;margin:12px 0}
#family-trip-integrated .stay-date{padding:12px;background:#e9f4f0;border-radius:13px;color:#176d67;min-width:100px}
#family-trip-integrated button:focus-visible{outline:3px solid #e9ae54;outline-offset:2px}

 if(chosen){
 const s=data.find(x=>x.id===chosen);
 out.innerHTML='<button class="back" data-back>חזרה לרשימה →</button><div class="hero">'+cat(s)[1]+'</div><h2 dir="auto">'+esc(s.name)+'</h2><div class="pill">'+esc(labels[s.region]||s.region)+' · '+cat(s)[0]+'</div><button class="smallbtn" data-fav="'+esc(s.id)+'">'+(favorites.has(s.id)?'♥ נשמר במועדפים':'♡ שמירה למועדפים')+'</button><div class="more"><p dir="auto">'+esc(s.details)+'</p>'+s.notes.map(n=>'<p dir="auto">'+esc(n)+'</p>').join('')+'</div><div class="info-grid"><div class="info"><b>זמן ותאריך</b><p>'+when(s)+' '+esc(s.hours||'')+'</p><p>'+(s.drive!=null?'כ־'+s.drive+' דקות נסיעה':'זמן נסיעה טרם הוערך')+'</p></div><div class="info"><b>מחיר ופרטים</b><p dir="auto">'+esc(s.price||'יש לבדוק מחיר עדכני במקור')+'</p><p>'+({yes:'מתאים לגיל 3',maybe:'התאמה תלויה בילדה',no:'למבוגרים או לגיל גבוה יותר'}[s.kid]||'התאמה לגיל 3 טעונה בדיקה')+'</p><p dir="auto">'+esc(s.parking||'')+'</p></div></div><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address||s.name+' '+s.region)+'">פתיחה במפות ↗</a>'+s.sources.filter(u=>/^https?:/.test(u)).map((u,i)=>'<a class="maplink" href="'+esc(u)+'" target="_blank" rel="noopener">מקור '+(i+1)+' ↗</a>').join('');return;
 }
 if(view==='trip'){
 const legs=[['18–21.11','San Jose'],['21.11','Monterey'],['21.11','Big Sur'],['21–22.11','Morro Bay'],['22–24.11','Santa Barbara'],['24–27.11','Los Angeles'],['27.11–1.12','San Diego'],['1–4.12','Las Vegas'],['4–10.12','San Francisco'],['לילה גמיש בין 4–10.12','Napa Valley']];
 out.innerHTML='<h2>הטיול שלנו</h2>'+legs.map(([date,r])=>'<div class="stay"><div class="stay-date">'+date+'</div><div><h3>'+labels[r]+'</h3><button class="smallbtn" data-area="'+r+'">מקומות, אוכל וקניות ←</button></div></div>').join('');return;
 }
 if(!area&&view==='explore'){
 out.innerHTML='<h2>איפה מטיילים?</h2><div class="regions">'+Object.entries(labels).map(([r,n])=>{const items=data.filter(s=>s.region===r);return items.length?'<button class="region" data-area="'+r+'"><div class="region-image"><strong>'+n+'</strong></div><div class="region-foot">'+items.length+' מקומות והמלצות · לגלות ←</div></button>':''}).join('')+'</div>';return;
 }
 const local=data.filter(s=>(!area||s.region===area)&&(view!=='favorites'||favorites.has(s.id)));
 out.innerHTML='<button class="back" data-home>כל האזורים →</button><h2>'+esc(view==='favorites'?'המועדפים שלי':labels[area])+'</h2><div class="categories"><button data-cat="" class="'+(!category?'active':'')+'">הכול</button>'+Object.entries(categories).filter(([k])=>local.some(s=>s.category===k)).map(([k,v])=>'<button data-cat="'+k+'" class="'+(category===k?'active':'')+'">'+v[1]+' '+v[0]+'</button>').join('')+'</div><div class="toolbar"><input id="fti-search" aria-label="חיפוש מקומות" placeholder="חיפוש מקומות, אוכל וקניות" value="'+esc(query)+'"><select id="fti-drive" aria-label="זמן נסיעה"><option value="">כל זמני הנסיעה</option><option value="30">עד חצי שעה</option><option value="60">עד שעה</option><option value="120">עד שעתיים</option></select><label><input id="fti-kid" type="checkbox" '+(kidOnly?'checked':'')+'> מתאים לגיל 3</label></div><div id="fti-results"></div>';
 root.querySelector('#fti-drive').value=maxDrive;list();
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){view=b.dataset.view;area='';category='';chosen=null;query='';}
 else if('area'in b.dataset){area=b.dataset.area;view='explore';chosen=null;category='';query='';}
 else if('cat'in b.dataset){category=b.dataset.cat;}
 else if('id'in b.dataset){chosen=b.dataset.id;}
 else if('fav'in b.dataset){const id=b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);try {localStorage.setItem('family-trip-expanded-favorites-v1',JSON.stringify([...favorites]));} catch(e) {}}
 else if('home'in b.dataset){area='';view='explore';chosen=null;}
 else if('back'in b.dataset){chosen=null;}
 render();
});
root.addEventListener('input',e=>{if(e.target.id==='fti-search'){query=e.target.value;list();}});
root.addEventListener('change',e=>{if(e.target.id==='fti-drive')maxDrive=e.target.value;else if(e.target.id==='fti-kid')kidOnly=e.target.checked;list();});
render();
})();
</script>
</div>

</body>
</html>
