function tripOverview(){return `<section class="trip-wrap"><div class="eyebrow" style="color:var(--teal)">THE ROAD AHEAD</div><h2>Our road trip</h2><p class="stays-intro">18 November – 10 December 2026 · 7 overnight stays · 3 scenic travel stops · 22 nights. Follow the route, then explore the places worth seeing in each region.</p><div class="trip-summary"><div><strong>10</strong><span>Route stops</span></div><div><strong>22</strong><span>Nights</span></div><div><strong>2</strong><span>States</span></div></div><div class="trip-list">${TRIP_LEGS.map((s,i)=>`<article class="trip-leg"><div class="trip-index"><span>${i+1}</span></div><div class="trip-leg-body"><div class="trip-date">${escapeHTML(s.dates)} · ${s.nights ? `${s.nights} ${s.nights===1?'night':'nights'}` : 'Scenic stop'}</div><h3>${escapeHTML(s.city)}</h3>${s.region?`<button class="trip-explore" onclick="view='explore';goRegion(${JSON.stringify(s.region).replace(/"/g,'&quot;')})">Explore attractions <span aria-hidden="true">→</span></button>`:`<div class="trip-hint">Home base / travel days · no detailed attraction list yet</div>`}</div></article>`).join('')}</div><div class="banner">🧳 This shared guide deliberately excludes accommodation addresses, booking references, entry codes, and private contact details.</div><p class="privacy-note">The dates and cities above are visible to anyone you share or publish this app with. Keep the link limited to family if you prefer your itinerary not to be public.</p></section>`}
const REGIONS=['Santa Cruz','Monterey','Big Sur','Morro Bay','Santa Barbara','Los Angeles','LA to San Diego','San Diego','San Francisco','Las Vegas'];
const REGION_IMAGES={'Santa Cruz':'Santa Cruz, California','Monterey':'Monterey, California','Big Sur':'Big Sur','Morro Bay':'Morro Bay, California','Santa Barbara':'Santa Barbara, California','Los Angeles':'Los Angeles','LA to San Diego':'Dana Point, California','San Diego':'San Diego','San Francisco':'San Francisco, California','Las Vegas':'Las Vegas'};
const $=s=>document.querySelector(s), app=$('#app');let region=null,detail=null,search='',photoMap={};
try{photoMap=JSON.parse(localStorage.getItem('roadtrip_photos_v1')||'{}')}catch(e){}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function photo(article){return photoMap[article]||''}
function img(article,alt){let src=photo(article);return src?`<img loading="lazy" src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" onerror="this.remove()">`:`<div class="photo-fallback" aria-hidden="true">✦</div>`}
function goHome(){closeRegionMap();view='explore';region=null;detail=null;search='';render();recordNavigation();scrollTo(0,0)}
function goRegion(r){closeRegionMap();view='explore';region=r;detail=null;search='';render();recordNavigation();scrollTo(0,0)}
function goDetail(i){closeRegionMap();detail=i;render();recordNavigation();scrollTo(0,0)}
function render(){let html='';if(view==='trip'){html=tripOverview()}else if(detail!==null){const s=STOPS[detail];html=`<div class="detail"><div class="topline"><button class="back" onclick="backToRegion(${JSON.stringify(s.region).replace(/"/g,'&quot;')})">← ${escapeHTML(s.region)}</button><span class="hint">${s.kind==='shopping'?'Shopping details':s.kind==='restaurant'?'Restaurant details':s.kind==='rainy'?'Rainy-day idea':'Attraction details'}</span></div><div class="hero" data-article="${escapeHTML(s.article)}">${img(s.article,s.name)}<span class="photo-label">Photo: Wikipedia / Wikimedia Commons</span></div><h2>${escapeHTML(s.name)}</h2><div class="pill">${s.kind==='shopping'?'🛍️ Shopping ·':s.kind==='restaurant'?'🍽️ Restaurant ·':s.kind==='rainy'?'☔ Rainy-day idea ·':'📍'} ${escapeHTML(s.region)}</div><p class="lead">${escapeHTML(s.description)}</p>${s.address?`<p class="hint">📍 ${escapeHTML(s.address)}</p>`:''}<section class="more"><h3>${s.kind==='shopping'?'🛍️ Shopping highlights':s.kind==='restaurant'?'🍽️ What to try':'✨ What to see & do'}</h3><p>${escapeHTML(s.highlights)}</p><h3>💡 Good to know</h3><p>${escapeHTML(s.tip)}</p></section><div class="info-grid"><div class="info"><b>🚗 Parking</b><p>${escapeHTML(s.parking)}</p></div><div class="info"><b>${s.kind==='shopping'?'🛍️ Shopping':s.kind==='restaurant'?'🍽️ Food & prices':'🎟️ Admission'}</b><p>${escapeHTML(s.price)}</p></div></div><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address||s.name+' '+s.region)}">📍 Open in Google Maps ↗</a><p class="footnote">${s.kind==='shopping'?'Shopping details sourced from official outlet information; verify hours, store availability and parking before visiting.':s.region==='San Francisco'?'San Francisco additions researched from public visitor and venue information. Prices, hours and parking can change; check official sources before visiting.':'Original itinerary details supplemented with travel notes. Selected 2026 corrections checked against official sources; other prices, parking and opening hours may change.'} ${s.source?`<a href="${escapeHTML(s.source)}" target="_blank" rel="noopener">Official source ↗</a>`:""}</p></div>`}
else if(region){let items=STOPS.map((s,i)=>({...s,i})).filter(s=>s.region===region&&(`${s.name} ${s.description}`).toLowerCase().includes(search.toLowerCase()));html=`<div class="topline"><button class="back" onclick="backToLocations()">← All locations</button><span class="hint">${ATTRACTIONS().filter(s=>s.region===region).length} attractions${STOPS.some(s=>s.region===region&&s.kind==='restaurant')?' · '+STOPS.filter(s=>s.region===region&&s.kind==='restaurant').length+' food stops':''}</span></div><h2>${escapeHTML(region)}</h2><div class="mapactions"><span class="hint">See how the attractions are spread out</span><button class="map-open" onclick="toggleRegionMap()" id="map-toggle" aria-expanded="false">🗺️ View all on map</button></div><div id="region-map-container"></div><div class="toolbar"><input class="search" type="search" placeholder="Search places, shopping and food…" value="${escapeHTML(search)}" aria-label="Search attractions" oninput="updateSearch(this.value)"></div><div class="places" id="places">${placeCards(items.filter(s=>!['shopping','rainy','restaurant'].includes(s.kind)))}</div><section id="rainy-section" class="shopping-section">${rainySection(items)}</section><section id="shopping-section" class="shopping-section">${shoppingSection(items)}</section><section id="restaurant-section" class="shopping-section">${restaurantSection(items)}</section>`}
else{html=`<div class="topline"><div><div class="eyebrow" style="color:var(--teal)">Your itinerary</div><h2 style="margin-bottom:0">Where are we exploring?</h2></div><span class="hint">${REGIONS.length} regions · ${ATTRACTIONS().length} attractions · 4 outlets · ${STOPS.filter(s=>s.kind==='restaurant').length} food stops</span></div><div class="regions">${REGIONS.map(r=>`<button class="region" onclick="goRegion(${JSON.stringify(r).replace(/"/g,'&quot;')})"><div class="region-image" data-article="${escapeHTML(REGION_IMAGES[r])}">${img(REGION_IMAGES[r],r)}<strong>${escapeHTML(r)}</strong></div><div class="region-foot"><span>${ATTRACTIONS().filter(s=>s.region===r).length} attractions${STOPS.some(s=>s.region===r&&s.kind==='shopping')?' · Shopping':''}${STOPS.some(s=>s.region===r&&s.kind==='restaurant')?' · Food':''}</span><span>Explore →</span></div></button>`).join('')}</div><div class="offline"><div><b>📶 Prepare for offline use</b><p>While on Wi-Fi, load the photos and save them for later. Requires opening this app from its hosted HTTPS link.</p></div><button class="smallbtn" id="download" onclick="prepareOffline()">Prepare photos</button></div><div class="banner">💡 Tap a region, then an attraction to see its photo, description, parking and ticket information. No accounts or tracking needed.</div>`}
app.innerHTML=`<nav class="tabs" aria-label="App sections"><button class="${view==='trip'?'active':''}" onclick="setView('trip')">🗓️ Our Trip</button><button class="${view==='explore'?'active':''}" onclick="setView('explore')">🧭 Explore</button></nav>`+html;loadVisiblePhotos()}
function rainySection(items){let picks=items.filter(s=>s.kind==='rainy');return picks.length?`<div class="shopping-heading"><div class="eyebrow" style="color:var(--teal)">INDOOR ALTERNATIVES</div><h3>☔ For rainy days</h3><p>Two indoor options if the weather changes.</p></div><div class="places">${placeCards(picks)}</div>`:''}
function restaurantSection(items){let food=items.filter(s=>s.kind==='restaurant');return food.length?`<div class="shopping-heading"><div class="eyebrow" style="color:var(--teal)">FOOD & COFFEE</div><h3>🍽️ Restaurants & cafés</h3><p>Places to eat, grab coffee or stop for a treat.</p></div><div class="places">${placeCards(food)}</div>`:''}
function shoppingSection(items){let shops=items.filter(s=>s.kind==='shopping');return shops.length?`<div class="shopping-heading"><div class="eyebrow" style="color:var(--teal)">OPTIONAL STOPS</div><h3>🛍️ Shopping</h3><p>Outlets you can visit if your schedule allows.</p></div><div class="places">${placeCards(shops)}</div>`:''}
function placeCards(items){return items.map(s=>`<button class="place" onclick="goDetail(${s.i})"><div class="thumb" data-article="${escapeHTML(s.article)}">${img(s.article,s.name)}</div><div class="place-info"><div class="pill">${escapeHTML(s.kind==='shopping'?'Shopping · '+s.region:s.kind==='restaurant'?'Food · '+s.region:s.kind==='rainy'?'Rainy-day idea · '+s.region:s.region)}</div><strong>${escapeHTML(s.name)}</strong><small>${escapeHTML(s.description)}</small></div></button>`).join('')||'<div class="empty">No matching places found.</div>'}
function updateSearch(v){search=v;let items=STOPS.map((s,i)=>({...s,i})).filter(s=>s.region===region&&(`${s.name} ${s.description}`).toLowerCase().includes(search.toLowerCase()));$('#places').innerHTML=placeCards(items.filter(s=>!['shopping','rainy','restaurant'].includes(s.kind)));let shop=$('#shopping-section');if(shop)shop.innerHTML=shoppingSection(items);let rain=$('#rainy-section');if(rain)rain.innerHTML=rainySection(items);let food=$('#restaurant-section');if(food)food.innerHTML=restaurantSection(items);loadVisiblePhotos()}

// Region map: Leaflet uses ordinary image tiles, without WebGL.
// Exact/approximate pins are embedded, so no geocoding queries occur.
let mapInstance=null,mapMarkers=[],mapOpen=false,mapEpoch=0,selectedMapItems=[];
let leafletLoader=null;
function loadLeaflet(){
 if(window.L)return Promise.resolve(window.L);
 if(leafletLoader)return leafletLoader;
 const urls=['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'];
 const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
 leafletLoader=new Promise((resolve,reject)=>{
  function attempt(i){if(i>=urls.length){reject(new Error('Map script could not download'));return;}
   const s=document.createElement('script');s.src=urls[i];s.onload=()=>window.L?resolve(window.L):attempt(i+1);s.onerror=()=>attempt(i+1);document.head.appendChild(s);
  }attempt(0);
 });return leafletLoader;
}
function closeRegionMap(){mapEpoch++;mapOpen=false;if(mapInstance){mapInstance.remove();mapInstance=null;}mapMarkers=[];const area=$('#region-map-container');if(area)area.innerHTML='';const btn=$('#map-toggle');if(btn){btn.textContent='🗺️ View all on map';btn.setAttribute('aria-expanded','false');}}
function toggleRegionMap(){if(mapOpen)hideRegionMap();else{showRegionMap();recordNavigation()}}
function mapFallback(message){
 const status=$('#map-status');if(status)status.textContent=message;
 const info=$('#map-help');if(info)info.hidden=false;
 const holder=$('#all-stops-map');if(holder&&!window.L){holder.innerHTML='<div class="map-error-box">The interactive map did not load. You can still open each place in Google Maps using the links below.</div>';}
}
function mapPlaceLinks(){return selectedMapItems.map(s=>{
 const query=s.address||s.name+', '+s.region+', '+(s.region==='Las Vegas'?'NV':'CA');
 return `<a href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(query)}" rel="noopener" target="_blank">${escapeHTML(s.name)} ↗</a>`;
 }).join('')}
async function showRegionMap(){
 if(!region||view!=='explore')return;
 mapOpen=true;const activeRegion=region,epoch=++mapEpoch;
 selectedMapItems=STOPS.map((s,i)=>({...s,i})).filter(s=>s.region===activeRegion && Array.isArray(s.coords) && s.coords.length===2);
 const area=$('#region-map-container'),btn=$('#map-toggle');if(!area)return;
 btn.textContent='✕ Hide map';btn.setAttribute('aria-expanded','true');
 area.innerHTML=`<section class="map-panel"><div class="map-head"><div><h3>📍 ${escapeHTML(activeRegion)} · places & map</h3><p>Teal: attractions · Orange: shopping · Purple: food · Tap a pin for details</p></div><button class="map-close" onclick="hideRegionMap()">Close map</button></div><div id="all-stops-map" role="region" aria-label="Map of ${escapeHTML(activeRegion)} attractions"></div><p class="map-status" id="map-status" role="status">Loading map…</p><div id="map-help" class="map-help" hidden><p>If the background map is unavailable, open the attractions individually in Google Maps:</p><div class="map-place-links">${mapPlaceLinks()}</div></div><p class="map-legend">Pin positions are approximate for large areas and viewpoints. Use Google Maps and local signage for driving directions.</p></section>`;
 const holder=$('#all-stops-map');
 try{
  const L=await loadLeaflet();if(epoch!==mapEpoch||!mapOpen||region!==activeRegion)return;
  const status=$('#map-status');
  mapInstance=L.map(holder,{scrollWheelZoom:false,zoomControl:true,preferCanvas:false});
  const bounds=[];
  for(const s of selectedMapItems){
   const [lat,lon]=s.coords;bounds.push([lat,lon]);
   const color=s.kind==='shopping'?'#d18432':s.kind==='restaurant'?'#8960bd':'#0b8d84';
   const marker=L.circleMarker([lat,lon],{radius:10,weight:2,color:'#fff',fillColor:color,fillOpacity:1}).addTo(mapInstance);
   const nav='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address||s.name+', '+s.region+', '+(s.region==='Las Vegas'?'NV':'CA'));
   marker.bindPopup(`<div class="map-pin-name">${escapeHTML(s.name)}</div>${s.mapNote?`<div class="map-pin-note">📌 ${escapeHTML(s.mapNote)}</div>`:''}<button class="map-popup-button" onclick="goDetail(${s.i})">View details</button><br><a class="map-pop-link" rel="noopener" target="_blank" href="${escapeHTML(nav)}">Open in Google Maps ↗</a>`,{maxWidth:270});
   mapMarkers.push(marker);
  }
  if(bounds.length===1)mapInstance.setView(bounds[0],12);else if(bounds.length)mapInstance.fitBounds(bounds,{padding:[35,35],maxZoom:13,animate:false});
  else mapInstance.setView([36,-120],8);
  // Public ArcGIS legacy tiled basemaps. No application API key is passed.
  // Never use third-party tile servers that return 401 due to missing authentication.
  const layers=[
    {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
     name:'Esri World Street Map'},
    {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
     name:'Esri World Topographic Map'}
  ];
  const credit='Tiles &copy; Esri and its data providers';
  let activeLayer=null,attempt=0,tilesLoaded=0;
  const help=$('#map-help');
  function providerFailed(){
    if(epoch!==mapEpoch||!mapOpen)return;
    if(activeLayer){mapInstance.removeLayer(activeLayer);activeLayer=null;}
    attempt++;
    if(attempt<layers.length){loadProvider();}
    else {status.textContent='The map background could not load. All pins are available below in Google Maps.';if(help)help.hidden=false;}
  }
  function loadProvider(){
    if(epoch!==mapEpoch||!mapOpen)return;
    const thisProvider=layers[attempt];
    tilesLoaded=0;
    status.textContent='Loading '+thisProvider.name+'…';
    const layer=L.tileLayer(thisProvider.url,{maxZoom:18,attribution:credit,updateWhenIdle:true,keepBuffer:1});
    activeLayer=layer;
    let errors=0;
    layer.on('tileload',()=>{
      if(activeLayer!==layer||epoch!==mapEpoch)return;
      tilesLoaded++;
      status.textContent=`${selectedMapItems.length} pins ready · ${thisProvider.name}`;
    });
    layer.on('tileerror',()=>{
      if(activeLayer!==layer||epoch!==mapEpoch)return;
      errors++;
      if(errors>=2&&tilesLoaded===0)providerFailed();
    });
    layer.addTo(mapInstance);
    setTimeout(()=>{if(epoch!==mapEpoch||!mapOpen||activeLayer!==layer)return;
       if(tilesLoaded===0)providerFailed();
    },6500);
  }
  loadProvider();
  setTimeout(()=>{if(epoch!==mapEpoch||!mapOpen)return;mapInstance?.invalidateSize();},500);
  setTimeout(()=>{if(epoch===mapEpoch&&mapOpen)mapInstance?.invalidateSize();},250);
 }catch(err){if(epoch===mapEpoch)mapFallback('Could not load the map library. Check your connection and try again.');}
}
// Native Android/browser Back and Forward navigation, including open maps.
// State is stored in same-document history, compatible with GitHub Pages.
let navigationTrail=[];
function currentScreen(){return {tripApp:true,view,region,detail,mapOpen:!!mapOpen};}
function recordNavigation(){
 const state=currentScreen();
 const old=history.state;
 if(old&&old.tripApp&&old.view===state.view&&old.region===state.region&&old.detail===state.detail&&old.mapOpen===state.mapOpen)return;
 history.pushState(state,'');
 navigationTrail.push(state);
}
function restoreScreen(state){
 closeRegionMap();
 view=state.view==='explore'?'explore':'trip';
 region=typeof state.region==='string'&&REGIONS.includes(state.region)?state.region:null;
 detail=Number.isInteger(state.detail)&&state.detail>=0&&state.detail<STOPS.length?state.detail:null;
 if(view==='trip'){region=null;detail=null;}
 search='';render();
 if(state.mapOpen&&view==='explore'&&region&&detail===null)showRegionMap();
 scrollTo(0,0);
}
window.addEventListener('popstate',event=>{
 if(event.state&&event.state.tripApp){restoreScreen(event.state);const idx=navigationTrail.findLastIndex(s=>s===event.state || (s.view===event.state.view&&s.region===event.state.region&&s.detail===event.state.detail&&s.mapOpen===event.state.mapOpen));if(idx>=0)navigationTrail.length=idx+1;}
});
function hideRegionMap(){
 if(mapOpen&&history.state?.tripApp&&history.state.mapOpen){history.back();return;}
 closeRegionMap();
}
function backToRegion(r){
 if(navigationTrail.length>=2){
  const previous=navigationTrail[navigationTrail.length-2];
  if(previous.view==='explore'&&previous.region===r&&previous.detail===null){history.back();return;}
 }
 goRegion(r);
}
function backToLocations(){
 if(navigationTrail.length>=2){
  const previous=navigationTrail[navigationTrail.length-2];
  if(previous.view==='explore'&&previous.region===null&&previous.detail===null){history.back();return;}
 }
 goHome();
}

const pending={};async function fetchPhoto(article){if(photoMap[article])return photoMap[article];if(pending[article])return pending[article];pending[article]=(async()=>{try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(article),{headers:{'Accept':'application/json'}});if(!res.ok)return '';let j=await res.json();let url=j.thumbnail?.source||j.originalimage?.source||'';if(url){photoMap[article]=url;try{localStorage.setItem('roadtrip_photos_v1',JSON.stringify(photoMap))}catch(e){}}return url}catch(e){return ''}})();return pending[article]}
function loadVisiblePhotos(){document.querySelectorAll('[data-article]').forEach(async el=>{let article=el.dataset.article;if(photo(article))return;let url=await fetchPhoto(article);if(url&&el.isConnected&&el.dataset.article===article){let old=el.querySelector('.photo-fallback');if(old){let im=document.createElement('img');im.loading='lazy';im.alt='Attraction photograph';im.src=url;im.onerror=()=>im.remove();old.replaceWith(im)}}})}
async function prepareOffline(){let b=$('#download');if(!b)return;b.disabled=true;if(!('serviceWorker'in navigator)||!navigator.serviceWorker.controller){b.textContent='Host app to enable offline';return}let all=[...new Set([...STOPS.map(s=>s.article),...Object.values(REGION_IMAGES)])];let count=0;for(let article of all){let url=await fetchPhoto(article);if(url){try{await fetch(url,{mode:'no-cors'})}catch(e){}}count++;b.textContent=`Preparing ${count}/${all.length}`;}b.textContent='Photos prepared ✓';b.disabled=false}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(history.state?.tripApp){restoreScreen(history.state);navigationTrail.push(history.state)}else{history.replaceState(currentScreen(),'');navigationTrail.push(history.state);render();}
</script></body></html>
